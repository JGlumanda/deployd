name: deployd

# First time setup: Create empty config.json before starting
# Run: echo "{}" > config.json
#
# For production with HTTPS: docker-compose -f docker/docker-compose.prod.yml up -d
# For use with own reverse proxy: docker-compose -f docker/docker-compose.simple.yml up -d

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: deployd
    ports:
      - "3000:3000"
    environment:
      - ADMIN_PASSWORD=${ADMIN_PASSWORD:-admin}
      - GITHUB_TOKEN=${GITHUB_TOKEN:-}
      - NODE_ENV=production
    volumes:
      - ./config.json:/app/config.json
    restart: unless-stopped
