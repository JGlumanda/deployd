services:
  app:
    image: deployd:latest
    build:
      context: .
      dockerfile: Dockerfile
    container_name: deployd
    ports:
      - "3000:3000"
    environment:
      - ADMIN_PASSWORD=${ADMIN_PASSWORD:-admin}
      - GITHUB_TOKEN=${GITHUB_TOKEN:-}
      - NODE_ENV=production
    volumes:
      - ./config.json:/app/config.json
    restart: unless-stopped
